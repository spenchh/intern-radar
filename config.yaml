# ============================================================================
# Notifications
# ============================================================================
notify:
  # On the very first run the store is empty, so EVERY match would look "new".
  # Leaving this false seeds the database silently instead of sending hundreds
  # of alerts. Set to true only if you deliberately want a full backfill.
  on_first_run: false

  # Cap alerts per run. Anything over the cap is left unmarked and goes out on
  # the next run, so nothing is ever silently dropped.
  max_per_run: 25

  # Discord embed colors per detected category (hex).
  colors:
    silicon: 0x7C3AED
    aerospace: 0x0EA5E9
    electrical: 0x10B981
    other: 0x64748B

# ============================================================================
# Storage / housekeeping
# ============================================================================
store:
  # Forget postings we haven't seen in this many days, to keep the state file small.
  forget_after_days: 150
